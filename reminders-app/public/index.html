<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recordatorios Unificados</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>🔔 Recordatorios Unificados</h1>
      <p class="app__subtitle">Todoist, Apple Reminders y Microsoft To Do en un solo lugar</p>
    </header>

    <div class="toolbar">
      <input
        type="search"
        id="search-input"
        class="toolbar__search"
        placeholder="🔍 Buscar por título o notas..."
      />
      <div class="toolbar__filters" role="group" aria-label="Filtrar por fuente">
        <button type="button" class="chip chip--active" data-filter="all">Todos</button>
        <button type="button" class="chip" data-filter="todoist">Todoist</button>
        <button type="button" class="chip" data-filter="icloud">Reminders</button>
        <button type="button" class="chip" data-filter="mstodo">Microsoft</button>
      </div>
      <label class="toolbar__toggle">
        <input type="checkbox" id="hide-completed" checked />
        Ocultar completados
      </label>
      <a href="/auth/microsoft/login" id="ms-connect-btn" class="btn btn--secondary">🔗 Conectar Microsoft</a>
      <button type="button" id="ms-disconnect-btn" class="btn btn--secondary" hidden>
        ❌ Desconectar Microsoft
      </button>
      <button type="button" id="refresh-btn" class="btn btn--secondary">🔄 Actualizar</button>
      <button type="button" id="new-reminder-btn" class="btn btn--primary">➕ Nuevo recordatorio</button>
    </div>

    <form id="new-reminder-form" class="new-reminder-form" hidden>
      <div class="new-reminder-form__field">
        <label for="new-title">Título</label>
        <input type="text" id="new-title" name="title" required placeholder="Ej: Llamar al banco" />
      </div>

      <div class="new-reminder-form__field">
        <label for="new-notes">Notas (opcional)</label>
        <textarea id="new-notes" name="notes" rows="2"></textarea>
      </div>

      <div class="new-reminder-form__field">
        <label for="new-due">Fecha (opcional)</label>
        <input type="date" id="new-due" name="due" />
      </div>

      <div class="new-reminder-form__destinations">
        <div class="new-reminder-form__destination">
          <label>
            <input type="checkbox" id="target-todoist" checked />
            Todoist
          </label>
          <select id="todoist-project" disabled></select>
        </div>
        <div class="new-reminder-form__destination">
          <label>
            <input type="checkbox" id="target-icloud" checked />
            Reminders (iCloud)
          </label>
          <select id="icloud-list" disabled></select>
        </div>
        <div class="new-reminder-form__destination">
          <label>
            <input type="checkbox" id="target-mstodo" />
            Microsoft To Do
          </label>
          <select id="mstodo-list" disabled></select>
        </div>
      </div>

      <p id="new-reminder-error" class="status-message" hidden></p>

      <div class="new-reminder-form__actions">
        <button type="submit" class="btn btn--primary" id="new-reminder-submit">Agregar</button>
        <button type="button" class="btn btn--secondary" id="new-reminder-cancel">Cancelar</button>
      </div>
    </form>

    <form id="edit-reminder-form" class="new-reminder-form" hidden>
      <div class="new-reminder-form__field">
        <label for="edit-title">Título</label>
        <input type="text" id="edit-title" required />
      </div>

      <div class="new-reminder-form__field">
        <label for="edit-notes">Notas (opcional)</label>
        <textarea id="edit-notes" rows="2"></textarea>
      </div>

      <div class="new-reminder-form__field">
        <label for="edit-due">Fecha (opcional)</label>
        <input type="date" id="edit-due" />
      </div>

      <p id="edit-reminder-error" class="status-message" hidden></p>

      <div class="new-reminder-form__actions">
        <button type="submit" class="btn btn--primary" id="edit-reminder-submit">Guardar cambios</button>
        <button type="button" class="btn btn--secondary" id="edit-reminder-cancel">Cancelar</button>
      </div>
    </form>

    <p id="status-message" class="status-message" hidden></p>

    <section id="list" class="reminders-list"></section>
  </div>

  <script src="script.js"></script>
</body>
</html>
